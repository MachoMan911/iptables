# 面壁者转发 - Go 后端配置文件
# 支持通过环境变量覆盖，或通过前端「数据库配置」弹窗动态修改自定义数据库名

server:
  host: "0.0.0.0"
  port: 8080
  jwt_secret: "wallfacer-grade3-jwt-secret-key-2026"
  jwt_expire_hours: 24

mysql:
  host: "127.0.0.1"
  port: 3306
  user: "root"
  password: "your_mysql_password"
  # 支持任意自定义数据库名，程序会自动创建该数据库及所需表结构
  database: "wallfacer_forwarder"
  charset: "utf8mb4"

auth:
  initial_admin_user: "admin"
  initial_admin_password: "Admin@2026!"
  max_failed_attempts: 5
  lockout_minutes: 15
  session_timeout_minutes: 30

dns_watcher:
  interval_seconds: 60

iptables:
  auto_enable_ip_forward: true
  chain_prefix: "IPT_FWD"
  dry_run: false

